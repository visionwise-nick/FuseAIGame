name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp share-cover.png _site/share-cover.png
          mkdir -p _site/appforge
          cp appforge/index.html _site/appforge/index.html
          cp appforge/favicon.png appforge/apple-touch-icon.png appforge/wechat-share.jpg _site/appforge/ 2>/dev/null || true
          if [ -d appforge/assets ]; then cp -R appforge/assets _site/appforge/; fi
          cp appforge/*.txt _site/appforge/ 2>/dev/null || true
          cp wechat-share.jpg _site/wechat-share.jpg
          cp wechat-share.png _site/wechat-share.png
          cp favicon.png _site/favicon.png
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp *.txt _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
